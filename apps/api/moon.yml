$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
stack: 'backend'
layer: 'application'
tags: ['nestjs']

tasks:
  dev:
    command: 'nest start --watch'
    preset: 'server'

  build:
    command: 'nest build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
    outputs:
      - 'dist'

  start:
    command: 'node dist/main.js'

  test:
    command: 'jest'
    deps:
      - '^:build'

  test-e2e:
    command: 'jest --config ./test/jest-e2e.json'

  lint:
    command: 'eslint'
    args:
      - '{src,test}/**/*.ts'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'eslint.config.*'
